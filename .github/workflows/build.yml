name: Build the Mix System installers

# Run it from the Actions tab (Run workflow) whenever any Mix System plugin has a new version:
# it pulls the newest zip of each one from its downloads-macos / downloads-windows branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The package's own version: the build date (Chicago), plus .2, .3... for a second build that day.
  # Every version is kept: a GitHub release per version, and versioned file names on the site.
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - id: v
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          base=$(TZ=America/Chicago date +%Y.%m.%d); ver=$base; n=1
          while gh release view "mix-system-v$ver" -R "${{ github.repository }}" >/dev/null 2>&1; do n=$((n+1)); ver="$base.$n"; done
          echo "ver=$ver" >> "$GITHUB_OUTPUT"; echo "Mix System $ver"

  macos:
    needs: version
    env:   # only whether the Apple secrets exist, not the secrets themselves
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_APP_P12 != '' && secrets.MACOS_CERT_INSTALLER_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      PKG_VER: ${{ needs.version.outputs.ver }}
    runs-on: macos-15-intel   # pkgbuild/productbuild are arch-neutral; the plugins inside are universal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the plugins
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash fetch.sh macOS
      - name: Sign the plug-ins (Developer ID, when the Apple secrets are set)
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: bash mac/sign.sh
      - name: Build the .pkg
        run: bash mac/build.sh
      - name: Notarize and staple (when the Apple secrets are set)
        if: env.HAVE_NOTARY == 'true' && env.HAVE_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash mac/notarize.sh
      - name: Warn when the pkg is signed but not notarized
        if: env.HAVE_SIGNING == 'true' && env.HAVE_NOTARY != 'true'
        run: echo "::warning::The pkg is signed but not notarized, so macOS still blocks the first open. Add NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID."
      - name: Test-install it on this Mac
        run: bash mac/test-install.sh
      - name: Publish to downloads-macos
        shell: bash
        run: |
          set -e
          F=CDMC_master_system_installer-macOS.pkg
          D=CDMC_master_system_installer-v$PKG_VER-macOS
          mkdir -p "/tmp/z/$D" && cp "$F" "/tmp/z/$D/"
          cp "docs/Mix System User Guide.pdf" "/tmp/z/$D/"
          (cd /tmp/z && ditto -c -k --sequesterRsrc --keepParent "$D" "../$D.zip")
          cp "/tmp/$D.zip" .
          echo "$PKG_VER" > package-version.txt
          mkdir -p /tmp/dl && cp "$F" "/tmp/$D.zip" versions-macOS.txt package-version.txt /tmp/dl/ && cd /tmp/dl && git init -q -b downloads-macos && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$F for ${GITHUB_SHA}"
          for try in 1 2 3 4; do
            git -c http.postBuffer=157286400 push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" downloads-macos && break
            [ "$try" = 4 ] && exit 1; echo "push failed, retrying in 20 s"; sleep 20
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            CDMC_master_system_installer-v*-macOS.zip
            versions-macOS.txt

  windows:
    needs: version
    env: { PKG_VER: "${{ needs.version.outputs.ver }}" }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the plugins
        shell: bash
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash fetch.sh Windows
      - name: Build the setup .exe (Inno Setup)
        shell: pwsh
        run: |
          python windows/make_iss.py | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc build-win\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build-win\CDMC_master_system_installer-Windows.exe .
      - name: Test-install it on this PC
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\CDMC_master_system_installer-Windows.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $vst = "${env:CommonProgramFiles}\VST3"
          $app = "${env:ProgramFiles}\Castle Danger Music Company"
          Get-ChildItem $vst | Format-Table Name
          Get-ChildItem $app -Recurse -Depth 1 | Format-Table FullName
          $fail = 0
          Get-Content versions-Windows.txt | ForEach-Object {
            $name = ($_ -split ' ', 3)[2]
            $squash = $name -replace ' ', ''
            $hit = Get-ChildItem $vst -Filter *.vst3 | Where-Object { $_.Name -eq "$name.vst3" -or $_.Name -eq "$squash.vst3" }
            if (-not $hit) { Write-Host "::error::$name.vst3 missing"; $fail = 1 }
          }
          if (-not (Test-Path "$app\Guides\Mix System User Guide.pdf")) { Write-Host "::error::guide missing"; $fail = 1 }
          exit $fail
      - name: Publish to downloads-windows
        shell: bash
        run: |
          set -e
          F=CDMC_master_system_installer-Windows.exe
          D=CDMC_master_system_installer-v$PKG_VER-Windows
          mkdir -p "z/$D" && cp "$F" "z/$D/"
          cp "docs/Mix System User Guide.pdf" "z/$D/"
          (cd z && 7z a -tzip -mx=9 "../$D.zip" "$D" > /dev/null)
          echo "$PKG_VER" > package-version.txt
          mkdir -p /tmp/dl && cp "$F" "$D.zip" versions-Windows.txt package-version.txt /tmp/dl/ && cd /tmp/dl && git init -q -b downloads-windows && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$F for ${GITHUB_SHA}"
          for try in 1 2 3 4; do
            git -c http.postBuffer=157286400 push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" downloads-windows && break
            [ "$try" = 4 ] && exit 1; echo "push failed, retrying in 20 s"; sleep 20
          done
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            CDMC_master_system_installer-v*-Windows.zip
            versions-Windows.txt

  # every version is kept: one GitHub release per package version, with both installers and what's inside
  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PKG_VER: "${{ needs.version.outputs.ver }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art, merge-multiple: true }
      - run: |
          set -e
          {
            echo "The Master Mix System $PKG_VER: one installer for macOS (VST3 + AU, universal) and one for Windows (VST3)."
            echo; echo "What's inside:"
            awk '{v=$2; $1=""; $2=""; sub(/^  /,""); print "- " $0 " " v}' art/versions-macOS.txt
          } > notes.md
          cat notes.md
          gh release create "mix-system-v$PKG_VER" -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "The Master Mix System $PKG_VER" --notes-file notes.md art/*.zip
